<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流程管控台 Gatekeeper · 原型 v0.9（闭环后新建下一轮任务）</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --border:#e2e6eb; --border-strong:#cbd3dc;
  --text:#1f2328; --muted:#6b7280; --faint:#9aa3ae;
  --primary:#185FA5; --primary-bg:#E6F1FB; --primary-line:#85B7EB;
  --amber:#854F0B; --amber-bg:#FAEEDA; --amber-line:#EF9F27;
  --green:#1D9E75; --green-bg:#E1F5EE; --green-line:#9FE1CB;
  --red:#C0392B; --red-bg:#FCEBEB; --red-line:#F09595;
  --gray-bg:#F1EFE8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 13px;transition:.15s}
button:hover{border-color:var(--primary);color:var(--primary)}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.primary:hover{background:#0C447C;color:#fff}
button.danger{border-color:var(--red-line);color:var(--red);background:var(--red-bg)}
button.danger:hover{background:#f7d9d9}
button.warn{border-color:var(--amber-line);color:var(--amber);background:var(--amber-bg)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 9px}
button:disabled{opacity:.38;cursor:not-allowed;border-color:var(--border)}
input,textarea{font:inherit;padding:7px 10px;border:1px solid var(--border-strong);border-radius:7px;background:#fff;color:var(--text);width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--primary)}
.top{height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px}
.brand{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.brand span{color:var(--primary)}
.ver{font-size:11px;color:var(--faint);border:1px solid var(--border);padding:1px 7px;border-radius:20px;white-space:nowrap}
.crumb{font-size:12.5px;color:var(--muted);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.top .ctl{font-size:11px;color:var(--faint);white-space:nowrap}
.rolestrip{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;gap:6px}
.rolestrip button{border:0;border-radius:0;background:transparent;padding:11px 20px;font-size:13px;color:var(--muted);border-bottom:3px solid transparent}
.rolestrip button:hover{color:var(--primary);border-color:transparent}
.rolestrip button.on{color:var(--primary);font-weight:600;border-bottom-color:var(--primary);background:var(--primary-bg)}
.rolestrip .rs-tip{margin-left:auto;align-self:center;font-size:11px;color:var(--faint);text-align:right}
.boundary{background:var(--gray-bg);border-bottom:1px solid var(--border);padding:7px 20px;font-size:12px;color:#5F5E5A;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.boundary b{color:var(--text);font-weight:600}
.boundary .six{color:var(--primary);font-weight:600}
.boundary .no{color:var(--muted)}
.layout{display:flex;min-height:calc(100vh - 150px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px}
.ws-title{font-size:13px;font-weight:600;margin:0 0 6px 8px;color:var(--primary)}
.duty{font-size:11px;color:var(--muted);line-height:1.65;margin:0 8px 18px;padding:8px 9px;background:var(--bg);border-radius:7px;border:1px solid var(--border)}
.duty b{color:var(--text);font-weight:600}
.side h4{margin:0 0 9px 8px;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:1px}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.nav button{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--muted)}
.nav button:hover{background:var(--primary-bg);color:var(--primary)}
.nav button.on{background:var(--primary-bg);color:var(--primary);font-weight:600}
.phase-list{display:flex;flex-direction:column;gap:3px}
.phase-list div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);padding:3px 8px;border-radius:6px}
.phase-list div .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--border-strong);background:#fff;flex:0 0 9px}
.phase-list div.done{color:var(--green)}
.phase-list div.done .dot{background:var(--green);border-color:var(--green)}
.phase-list div.now{background:var(--amber-bg);color:var(--amber);font-weight:600}
.phase-list div.now .dot{background:var(--amber);border-color:var(--amber)}
.main{flex:1;padding:22px 26px;max-width:1280px;min-width:0;width:100%}
.page-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.page-head h1{font-size:19px;margin:0;font-weight:600}
.page-head p{margin:0;color:var(--muted);font-size:12px}
.nextstep{background:var(--primary-bg);border:1px solid var(--primary-line);border-radius:9px;padding:10px 13px;font-size:12.5px;color:var(--primary);margin-bottom:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.nextstep .who{font-weight:600;background:#fff;border-radius:20px;padding:1px 10px;border:1px solid var(--primary-line)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:15px;font-weight:600}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--text)}
.card .sub{color:var(--muted);font-size:12px;margin:0 0 12px}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;background:var(--primary-bg);color:var(--primary);border:1px solid var(--primary-line);vertical-align:middle}
.badge.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.badge.green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.badge.red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.badge.gray{background:var(--gray-bg);color:#5F5E5A;border-color:var(--border-strong)}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.notice{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--amber);margin-bottom:14px}
.notice.ok{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.notice.info{background:var(--primary-bg);border-color:var(--primary-line);color:var(--primary)}
.authbox{border:1px solid var(--border);border-radius:9px;padding:12px 13px;background:var(--surface)}
.authbox.next{background:var(--primary-bg);border-color:var(--primary-line)}
.authsec{font-size:11.5px;color:var(--muted);font-weight:600;margin:10px 0 6px;letter-spacing:.3px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.todo li{display:flex;gap:8px;font-size:12.5px;line-height:1.5}
.todo > li > span.mk{flex:0 0 16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;background:var(--border-strong);margin-top:2px}
.todo > li > span.mk.ck{background:var(--green)}
.todo > li > span.mk.warn2{background:var(--amber-line)}
.todo > li > span.mk.dot2{background:var(--primary-line)}
.todo > li > span.txt{flex:1;min-width:0}
.todo > li > span.txt em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.runlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.runlist li{display:flex;gap:7px;align-items:baseline;font-size:12px;color:var(--muted);line-height:1.45}
.runlist li i{font-style:normal;flex:0 0 18px;color:var(--faint);font-family:ui-monospace,monospace;font-size:10.5px}
.runlist li b{flex:0 0 68px;text-align:center;font-size:10.5px;font-weight:600;color:var(--primary);background:var(--primary-bg);border-radius:20px;padding:1px 0}
.runlist li b.toolchain{color:var(--green);background:var(--green-bg)}
.runlist li b.system{color:var(--muted);background:var(--gray-bg)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.checks li.no{border-color:var(--amber-line);background:#fffcf5}
.checks li.yes{border-color:var(--green-line);background:#f7fdfa}
.checks .mark{width:17px;height:17px;flex:0 0 17px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;margin-top:2px}
.checks li.yes .mark{background:var(--green)}
.checks li.no .mark{background:var(--amber-line)}
.checks .lbl{flex:1}
.checks .why{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}
.actions .why-dis{font-size:11.5px;color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:25px;font-weight:600;color:var(--primary);line-height:1.35;margin-top:3px}
.stat .d{font-size:11px;color:var(--faint)}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.ov-card.pending{border-color:var(--amber-line)}
.ov-card.frozen{border-color:var(--red-line)}
.ov-card.finished{background:#fbfdfc}
.ov-card .ttl{font-size:14px;font-weight:600;line-height:1.4}
.ov-card .desc{font-size:12px;color:var(--muted);min-height:34px}
.ov-card .meta{font-size:11.5px;color:var(--faint);line-height:1.6}
.ov-card .last{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:7px;padding:7px 9px;min-height:46px}
.ov-card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.mini{display:flex;gap:3px}
.mini span{flex:1;height:6px;border-radius:3px;background:var(--border);display:block}
.mini span.done{background:var(--green)}
.mini span.now{background:var(--amber-line)}
.pending-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px}
.pending-row .pl{flex:1;min-width:0}
.pending-row .pl b{font-size:13px}
.pending-row .pl span{display:block;font-size:11.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);padding:8px 9px;white-space:nowrap}
td{border-bottom:1px solid var(--border);padding:9px;vertical-align:top}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;color:var(--muted)}
pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px;overflow:auto;font:11.5px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:#3a4149;margin:0}
details summary{cursor:pointer;color:var(--primary);font-size:12px}
.phasegrid{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.phasegrid div{border:1px solid var(--border);border-radius:8px;padding:8px 4px;text-align:center;font-size:11px;color:var(--faint);background:var(--surface)}
.phasegrid div .pid{font-weight:600;font-size:12px;display:block}
.phasegrid div.done{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.phasegrid div.now{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.taskcard{border:1px solid var(--border);border-radius:9px;padding:11px 13px;margin-bottom:9px}
.taskcard.active{border-color:var(--primary-line);background:#f8fbff}
.taskcard.done{border-color:var(--green-line);background:#f7fdfa}
.taskcard.frozen{border-color:var(--red-line);background:#fff8f8}
.steps{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}
.steps span{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--gray-bg);color:var(--muted)}
.steps span.on{background:var(--green-bg);color:var(--green)}
.log{max-height:520px;overflow:auto}
.log div{display:flex;gap:10px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--border)}
.log .t{color:var(--faint);flex:0 0 62px;font-family:ui-monospace,monospace;font-size:11px}
.log .a{flex:0 0 74px;font-weight:600}
.log .a.ai{color:var(--primary)} .log .a.toolchain{color:var(--green)} .log .a.human{color:var(--amber)} .log .a.system{color:var(--muted)}
.log .d{color:var(--muted);flex:1}
.trace{max-height:420px;overflow:auto}
.tr{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border);font-size:12.5px}
.tr:last-child{border-bottom:0}
.tr .tm{color:var(--faint);flex:0 0 62px;font-family:ui-monospace,monospace;font-size:11px;padding-top:2px}
.tr .ac{flex:0 0 74px;font-weight:600}
.tr .ac.ai{color:var(--primary)} .tr .ac.toolchain{color:var(--green)} .tr .ac.system{color:var(--muted)}
.tr .bd{flex:1}
.tr .bd b{font-weight:600}
.tr .dt{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.tr .rs{font-size:11px;color:var(--green);margin-top:2px}
.tr.fail .rs{color:var(--red)}
.tr.cur{background:#f8fbff}
.selfreport{background:var(--gray-bg);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--muted);margin-top:12px}
.selfreport b{color:var(--red)}
.mem{border:1px solid var(--border);border-radius:9px;padding:11px 13px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start}
.mem .body{flex:1}
.mem .src{font-size:11px;color:var(--faint);margin-top:4px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;padding:10px 18px;border-radius:9px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.13);max-width:80vw;display:none}
.toast.ok{background:var(--green-bg);border:1px solid var(--green-line);color:var(--green)}
.toast.no{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red)}
.tag6{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag6 span{font-size:11px;background:var(--primary-bg);color:var(--primary);border:1px solid var(--primary-line);padding:1px 8px;border-radius:20px}
.ro{font-size:11px;color:var(--faint);border:1px dashed var(--border-strong);border-radius:20px;padding:1px 8px}
/* ---- 执行追溯 / 模拟文件 ---- */
.lnk{display:inline-block;border:0;background:none;color:var(--primary);font-size:11.5px;cursor:pointer;padding:1px 3px;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.lnk:hover{color:var(--amber)}
.hl{background:var(--amber-bg)!important}
.chipbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted);cursor:pointer}
.chip.on{background:var(--primary-bg);border-color:var(--primary-line);color:var(--primary);font-weight:600}
.rcp-wrap{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
.rcp-list{max-height:660px;overflow:auto;border:1px solid var(--border);border-radius:9px;position:sticky;top:10px}
.rcp-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:var(--surface);padding:9px 11px;cursor:pointer;font-size:12px;line-height:1.5}
.rcp-item:last-child{border-bottom:0}
.rcp-item:hover{background:var(--bg)}
.rcp-item.on{background:var(--primary-bg);border-left:3px solid var(--primary-line);padding-left:8px}
.rcp-item .r1{display:flex;gap:8px;align-items:center;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}
.rcp-item .r2{font-weight:600;margin-top:2px}
.rcp-item .r3{color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcp-detail{border:1px solid var(--border);border-radius:9px;padding:14px 15px;background:var(--surface)}
.sect{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--muted);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sect:first-child{margin-top:0}
.kv{width:100%;font-size:12px;border-collapse:collapse}
.kv td{border-bottom:1px dashed var(--border);padding:5px 7px;vertical-align:top}
.kv td:first-child{color:var(--muted);width:120px;white-space:nowrap}
.kv td:last-child{word-break:break-word}
.minitb{width:100%;font-size:11.5px;border-collapse:collapse;margin-bottom:7px}
.minitb th{font-size:11px;padding:5px 6px;background:var(--bg)}
.minitb td{padding:5px 6px;word-break:break-word}
.filebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--primary-bg);border:1px solid var(--primary-line);border-radius:9px;margin-bottom:12px}
.filebar .fp{font-family:ui-monospace,monospace;font-size:12px;color:var(--primary);font-weight:600}
.fileview{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:16px 18px;font:12px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:#3a4149}
.simtag{font-size:11px;color:var(--amber);border:1px dashed var(--amber-line);border-radius:20px;padding:1px 8px}
@media(max-width:1100px){.grid2,.grid3,.stats{grid-template-columns:repeat(2,1fr)}.side{width:170px;flex-basis:170px}.phasegrid{grid-template-columns:repeat(6,1fr)}.rcp-wrap{grid-template-columns:1fr}}
@media(max-width:760px){.grid2,.grid3,.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">流程管控台 <span>Gatekeeper</span></div>
  <div class="ver">原型 v0.9 · 闭环后新建下一轮任务</div>
  <div class="crumb" id="crumb">总览</div>
  <div class="spacer"></div>
  <span class="ctl">演示控制（非流程动作）</span>
  <button class="ghost" id="backBtn" data-act="back" style="display:none">← 返回总览</button>
  <button class="ghost" data-act="reset">重置演示</button>
</div>
<div class="rolestrip" id="rolestrip">
  <button data-view="human">人 · 工作台（可操作）</button>
  <button data-view="ai">AI 执行观测（只读）</button>
  <button data-view="toolchain">工具链观测（只读）</button>
  <span class="rs-tip">系统只给人使用；人的一次判断（批准 / 打回 / Review / 裁决）即授权后续执行，AI 与工具链自动完成，过程与日志在观测区查看</span>
</div>
<div class="boundary">
  <span><b>系统只负责六件事</b> <span class="six">状态 · 工件 · 证据 · 审批 · 记忆 · 度量</span></span>
  <span class="no"><b>不做</b>：生成代码 / 运行构建 / 托管源码 —— 由既有 Git、CI 与 AI 编码工具承担</span>
</div>
<div class="layout">
  <div class="side" id="side">
    <div class="ws-title" id="ws-title"></div>
    <div class="duty" id="duty"></div>
    <h4>本区页面</h4>
    <div class="nav" id="nav"></div>
    <h4>G0–G10 流程进度</h4>
    <div class="phase-list" id="side-phases"></div>
  </div>
  <div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>

<script id="gk-logic">
/* ============================================================
   纯逻辑层：不依赖 DOM，可被 Node 自检脚本直接加载执行
   职责边界：只管 状态 / 工件 / 证据 / 审批 / 记忆 / 度量
   主体边界：AI 仅 produce，工具链仅 sign，仅人可 approve / reject / 裁决 / 触发
   多实例：createSeedRoot 用同一套流程逻辑真实推进出多个开发任务，不写死状态

  function taskById(s,id){ return s.tasks.filter(t=>t.id===id)[0]||null; }
  function taskStepOf(s,t){ return s.taskStep[t.id]||{test:false,red:false,impl:false,green:false,review:'pending',verify:false}; }
  function depsSatisfied(s,t){
    return (t.deps||[]).every(d=>{ const p=taskById(s,d); return !p || (s.taskStep[d]&&s.taskStep[d].review==='ok'); });
  }
  function filesOverlap(a,b){
    const fa=(a.scope||[]).concat(a.diff||[]), fb=(b.scope||[]).concat(b.diff||[]);
    return fa.some(f=>fb.indexOf(f)>=0);
  }

     若把它排除在批次外，一旦该 Task 熔断被裁决、或需要重跑，就再也生成不出执行计划。 */
  function taskNeedsWork(s,t){
    const st=s.taskStep[t.id];
    if(!st) return true;                                  // 未开工
    if(st.review==='ok') return false;                     // 已签字
    if(st.review==='rejected') return true;                // 被打回，需按意见重做
    if(st.test&&st.red&&st.impl&&st.green) return false;   // 证据齐备，只等人签字

      return depsSatisfied(s,t);

    pend.forEach(t=>{ if(batch.every(b=>!filesOverlap(b,t))) batch.push(t); });
    return batch;

        s.tasks.forEach(t=>{ s.taskStep[t.id]={test:false,red:false,impl:false,green:false,review:'pending',verify:false}; s.failCount[t.id]=0; s.escalated[t.id]=false; });
        return {title:'Task 清单（'+s.tasks.length+' 项，均可独立验证）',
          data:{tasks:s.tasks.map(t=>({id:t.id,目标:t.title,涉及文件:t.scope,验证方式:t.verify,覆盖AC:t.acs,依赖前置:t.deps||[]})),
            依赖关系:s.tasks.map(t=>t.id+(t.deps&&t.deps.length?'←'+t.deps.join('/'):'（无依赖）')).join('，'),
            并发说明:'依赖已满足且改动文件互不重叠的 Task 可同批并行；评审单位是单个 Task，各自独立签字'}};
      case 'G5': return {title:'验证报告草稿', data:{结论:'待工具链证据确认', 范围:'全量回归 + 静态检查 + 覆盖率', 遗留问题:[]}};
      case 'G6': return {title:'AI 预审清单', data:{风格一致性:'通过', 命名:'通过', 潜在bug:'2 处待人工确认', 安全:'未发现高危', 需人终审:['业务正确性','架构合理性']}};
      case 'G7': return {title:'验收标准用例矩阵', data:{matrix:s.acs.map(a=>({AC:a.id, 用例:['正向','边界','异常'], 判据:a.testable})), 覆盖:s.acs.length+'/'+s.acs.length}};
      case 'G8': return {title:'Changelog + 发布单（预填）', data:{版本:'v1.4.0-rc.1', 变更:['新增短信验证码登录','补充限流与重放保护'], 发布单:'待人签署', 回滚方案:'切回 v1.3.9'}};
      case 'G9': return {title:'告警诊断报告 + 处置建议', data:{告警聚类:'/sms/send 超时 12 条 → 1 个事件', 初步定位:'关联本次发布 diff 与 Redis 连接池日志', 建议:['扩容连接池','必要时回滚'], 重大操作:'需人批准'}};
      case 'G10': {
        const notes = s.reviewNotes;
        const texts = notes.length
          ? notes.map(n=>'约束：'+n.pid+' 阶段出现「'+n.reason+'」时，AI 提交前须自行检查并规避')
          : ['约束：本轮无 Review 打回，保留现有 AC 结构化模板与 Plan 文件清单粒度'];
        // 打回后重跑 G10 时按文本去重，避免同一条教训重复生成候选记忆
        const exists=new Set(s.memories.filter(m=>m.round===s.round).map(m=>m.text));
        texts.filter(text=>!exists.has(text)).forEach((text,i)=>s.memories.push({
          id:nid(s,'M'), text,       status:'candidate', source:notes.length?notes[Math.min(i,notes.length-1)].pid+' 打回':'G10 归纳（本轮无打回）',
          category:'历史教训', scope:'全局', hits:0, round:s.round, ts:Date.now()
        }));
        return {title:'候选记忆规则（'+texts.length+' 条）', data:{候选规则:texts, 来源:notes.length?notes.map(n=>n.reason):['本轮事件日志'], 待办:'需人在「记忆确认」页确认入库或撤销'}};
      }
      default: return {title:pid+' 阶段产出', data:{}};
    }
  }
  function buildEvidence(s,pid){
    switch(pid){
      case 'G0': return {代码库文件数:1428, 索引版本:'idx-'+hash(pid+s.round), 结果:'OK'};
      case 'G1': return {验收标准数:s.acs.length, 可测试:s.acs.filter(a=>a.testable).length, 矛盾项:0, 缺失项:1, 结果:'PASS'};
      case 'G2': return {改动面文件:s.plan?s.plan.files.length:0, 方案数:3, 依赖影响:'无新增外部依赖', 结果:'PASS'};
      case 'G3': return {Task数:s.tasks.length, 全部含验证方式:s.tasks.every(t=>t.verify), AC覆盖:['AC-01','AC-02','AC-03'], 结果:'PASS'};
      case 'G5': s.coverageDrop=false; return {全量回归:'1286 passed / 0 failed', 静态检查:'0 error / 0 warning', 覆盖率:'82.1% → 84.3%（未下降）', 结果:'PASS'};
      case 'G6': return {静态分析复核:'0 high / 1 medium', 结果:'PASS'};
      case 'G7': return {用例总数:s.acs.length*3, 通过:s.acs.length*3, 失败:0, AC覆盖:s.acs.length+'/'+s.acs.length, 结果:'PASS'};
      case 'G8': return {产物校验:'sha256 一致', 预发冒烟:'PASS', 结果:'PASS'};
      case 'G9': return {告警聚类:'12 → 1', 变更关联:'v1.4.0-rc.1', 结果:'PASS'};
      case 'G10': return {事件总数:s.events.length, 门禁审批数:s.approvals.length, 打回数:s.reviewNotes.length, 结果:'PASS'};
      default: return {结果:'PASS'};
    }
  }

  function aiSubmit(s,role){
    const p = cur(s);
    if(!p) return {ok:false,msg:'本轮流程已结束，可开启下一轮'};
    if(role!=='ai') return deny(s,role,'提交 AI 产出',p.id);
    if(p.id==='G4') return {ok:false,msg:'G4 是逐 Task 实现循环，由自动执行按 Task 推进'};
    if(s.artifacts.some(a=>a.phase===p.id && a.kind==='ai')) return {ok:false,msg:'该阶段 AI 产出已提交，等待工具链签名与人工审批'};
    const built = buildArtifact(s,p.id);
    const art = {id:nid(s,'A'), phase:p.id, kind:'ai', type:p.ai, title:built.title, version:1,
      hash:hash(p.id+JSON.stringify(built.data)+s.round), producer:'AI Agent', ts:Date.now(), data:built.data,
      selfReport:'已自测全绿（不构成证据）'};
    art.file=buildFile(art);   // 每份产出都登记一份可点开的模拟文件，用于模拟人评审
    s.artifacts.push(art);
    s.aiSuggestions++;
    s.lastAiSubmitAt = Date.now();
    log(s,'ai','ARTIFACT_SUBMITTED',p.id,built.title+' · 附自报声明「已自测全绿」，系统不采信');
    if(p.id==='G10') log(s,'ai','MEMORY_CANDIDATE',p.id,'已生成候选记忆规则，等待人确认');
    return {ok:true,msg:'AI 已提交 '+p.id+' 产出：'+built.title};
  }
  function toolSubmit(s,role){
    const p = cur(s);
    if(!p) return {ok:false,msg:'本轮流程已结束'};
    if(role!=='toolchain') return deny(s,role,'签名回传证据',p.id);
    if(p.id==='G4') return {ok:false,msg:'G4 的证据由实现循环逐 Task 产生'};
    if(s.evidences.some(e=>e.phase===p.id && e.kind==='stage')) return {ok:false,msg:'该阶段证据已由工具链签名回传'};
    const data = buildEvidence(s,p.id);
    const ev = {id:nid(s,'V'), phase:p.id, kind:'stage', type:'stage_evidence', title:p.ev,
      source:'toolchain', signer:'ci-runner-01', commitHash:hash(p.id+s.round+'commit'),
      diffHash:hash(p.id+s.round+'diff'), result:'PASS', ts:Date.now(), data};
    s.evidences.push(ev);
    log(s,'toolchain','EVIDENCE_SIGNED',p.id,p.ev+' · 签名 ci-runner-01 · 绑定 diff '+ev.diffHash);
    return {ok:true,msg:'工具链已签名回传 '+p.id+' 证据：'+p.ev};
  }

  function autoCheck(s){
    const p = cur(s);
    if(!p) return {items:[{label:'本轮流程已完成',ok:true,why:''}],passed:true};
    const hasArt = s.artifacts.some(a=>a.phase===p.id && a.kind==='ai');
    const hasEv = s.evidences.some(e=>e.phase===p.id && e.kind==='stage');
    const items = [];
    if(p.id==='G4'){
      const n=s.tasks.length;
      const ready=allTasksReviewed(s);
      items.push({label:n+' 个 Task 的 Diff 均通过人 Review（可独立评审，不必等前一个）',ok:ready,why:ready?'':'由人在「循环 Review」页逐 Task 签字'});
      const unexplained=s.tasks.some(t=>{const o=s.outOfScope[t.id]; return o && o.files.length && !o.explanation;});
      items.push({label:'无未说明的越界改动',ok:!unexplained,why:unexplained?'Plan 之外的文件改动必须人工填写理由':'自动比对 Diff 文件集 − Plan 改动清单'});
      const frozen=s.tasks.some(t=>s.escalated[t.id]);
      items.push({label:'无未裁决的失败熔断',ok:!frozen,why:frozen?'自测失败超过 '+FAIL_LIMIT+' 次，需人裁决':'失败即停计数正常'});
      const signed=s.tasks.length>0 && s.tasks.every(t=>
        s.evidences.some(e=>e.taskId===t.id && e.type==='verify_green') &&
        s.evidences.some(e=>e.taskId===t.id && e.type==='out_of_scope'));
      items.push({label:'每个 Task 均有工具链签名的绿测与越界检测证据',ok:signed,why:signed?'':'证据只能由工具链签名，AI 自报无效'});
    } else {
      items.push({label:'AI 已提交阶段产出：'+p.ai,ok:hasArt,why:hasArt?'':'由上一道人工授权自动执行完成'});
      items.push({label:'工具链已签名回传证据：'+p.ev,ok:hasEv,why:hasEv?'':'由人工授权后的自动执行完成；AI 自报「全绿」不构成证据'});
    }
    switch(p.id){
      case 'G0': {
        const n = activeMemory(s).length;
        items.push({label:'项目记忆已加载进上下文（当前 '+n+' 条生效）',ok:true,why:n?'G10 回流规则已注入本轮 G0':'首轮暂无历史记忆，G10 后将产生'});
        break;
      }
      case 'G1': items.push({label:'验收标准逐条可测试（≥3 条且含判据）',ok:s.acs.length>=3 && s.acs.every(a=>a.testable),why:'Spec 先行：AC 是后续全部验证的锚点'}); break;
      case 'G2': items.push({label:'Plan 与全部验收标准一一对应',ok:!!s.plan && s.acs.every(a=>!!(s.plan.acMap||{})[a.id]),why:'防止方案偏离需求'}); break;
      case 'G3': {
        const covered = s.acs.length>0 && s.acs.every(a=>s.tasks.some(t=>t.acs.indexOf(a.id)>=0));
        items.push({label:'Task 覆盖全部 AC，且每项有验证方式与文件范围',ok:s.tasks.length>=3 && covered && s.tasks.every(t=>t.verify&&t.scope.length),why:'粒度 = 可独立验证'});
        break;
      }
      case 'G5': items.push({label:'覆盖率未出现未说明的下降',ok:hasEv && !s.coverageDrop,why:'G5 门禁要求全绿且覆盖率不降'}); break;
      case 'G7': items.push({label:'用例矩阵覆盖全部验收标准',ok:hasEv && s.acs.length>0,why:'从 G1 的 AC 自动生成'}); break;
      case 'G10': {
        const pending = s.memories.filter(m=>m.round===s.round && m.status==='candidate').length;
        items.push({label:'候选记忆条目已由人确认（入库或撤销），剩 '+pending+' 条待处理',ok:hasArt && pending===0,why:'由人在「记忆确认」页完成'});
        break;
      }
    }
    return {items,passed:items.every(i=>i.ok)};
  }

  function approve(s,role){
    if(role!=='human'){
      log(s,'system','PERMISSION_DENIED',(cur(s)||{id:'GATE'}).id,'身份 '+role+' 尝试调用 approve 被拒绝：仅人有审批权');
      return {ok:false,msg:'权限拒绝：AI Agent / 工具链不具备 approve 权限（门禁制）'};
    }
    const c = autoCheck(s);
    if(!c.passed) return {ok:false,msg:'门禁未解锁：自动校验仍有 '+c.items.filter(i=>!i.ok).length+' 项未通过，不能审批'};
    const p = cur(s);
    if(!p) return {ok:false,msg:'本轮流程已结束'};
    const attempt = s.gateAttempts[p.id] || 1;
    const dur = s.lastAiSubmitAt ? Date.now()-s.lastAiSubmitAt : 0;
    s.approvals.push({phase:p.id,attempt,ok:true,ts:Date.now(),durationMs:dur});
    s.gateStatus[p.id]='approved';
    log(s,'human','GATE_APPROVED',p.id,p.gate+' · 第 '+attempt+' 次提交即通过 · 审批停留 '+Math.round(dur/1000)+'s');
    s.phaseIdx++;
    if(s.phaseIdx>=PHASES.length){
      s.finishedAt=Date.now();
      log(s,'system','ROUND_FINISHED','R'+s.round,'G0–G10 闭环完成，共 '+s.approvals.length+' 道门禁');
    }
    return {ok:true,msg:p.id+' 已由人签署放行'+(s.finishedAt?' · 本轮闭环完成，可开启下一轮验证记忆回流':'')};
  }
  function reject(s,role,reason){
    if(role!=='human'){
      log(s,'system','PERMISSION_DENIED',(cur(s)||{id:'GATE'}).id,'身份 '+role+' 尝试 reject 被拒绝');
      return {ok:false,msg:'权限拒绝：只有人能打回并裁决'};
    }
    const p = cur(s);
    if(!p) return {ok:false,msg:'本轮流程已结束'};
    const text = String(reason||'').trim();
    if(!text) return {ok:false,msg:'请填写打回意见：它会成为 G10 提炼项目记忆的输入'};
    s.gateAttempts[p.id]=(s.gateAttempts[p.id]||1)+1;
    if(p.id==='G1'||p.id==='G2') s.reworks++;
    s.reviewNotes.push({pid:p.id,reason:text,ts:Date.now()});
    s.artifacts=s.artifacts.filter(a=>!(a.phase===p.id&&a.kind==='ai'));
    s.evidences=s.evidences.filter(e=>!(e.phase===p.id&&e.kind==='stage'));
    if(p.id==='G4'){
      // 打回 G4 门禁 = 全部 Diff 需重新实现并重新 Review，否则重跑计划为空、打回没有实际效果
      s.taskIdx=0;
      s.tasks.forEach(t=>{
        s.taskStep[t.id]={test:false,red:false,impl:false,green:false,review:'pending',verify:false};
        s.failCount[t.id]=0; s.escalated[t.id]=false; delete s.outOfScope[t.id];
      });
      s.evidences=s.evidences.filter(e=>!(e.phase==='G4'&&e.kind==='task'));
      log(s,'system','G4_ROLLED_BACK','G4','门禁整体打回：'+s.tasks.length+' 个 Task 复位，需重新 TDD 与逐 Task Review');
    }
    s.memories.push({id:nid(s,'M'),text:'约束：'+p.id+' 阶段出现「'+text+'」时，AI 提交前须自行检查并规避',
      status:'candidate',source:p.id+' 打回',category:'历史教训',scope:p.id,hits:0,round:s.round,ts:Date.now()});
    log(s,'human','GATE_REJECTED',p.id,'打回意见：'+text+' · 已生成 1 条候选记忆');
    return {ok:true,msg:'已打回 '+p.id+'，意见已记录为候选记忆，已授权 AI 按意见自动重做'};
  }

  /* ---- G4 内层循环：AI 与工具链动作严格按主体拆开 ---- */
  function aiTaskAction(s,role,which,taskId){
    const p=cur(s);
    if(!p||p.id!=='G4') return {ok:false,msg:'仅 G4 实现循环可写测试与实现'};
    if(role!=='ai') return deny(s,role,'产出测试 / 实现代码',p.id);
    const t=taskId?taskById(s,taskId):currentTask(s);
    if(!t) return {ok:false,msg:'所有 Task 已完成'};
    if(s.escalated[t.id]) return {ok:false,msg:'该 Task 已熔断冻结，请人先裁决'};
    const st=s.taskStep[t.id];
    let n=0;
    if((which==='test'||which==='all') && !st.test){
      st.test=true;
      s.artifacts.push({id:nid(s,'A'),phase:'G4',kind:'ai',type:'test_code',title:t.id+' 测试代码（先写测试）',version:1,
        hash:hash(t.id+'test'+s.round),producer:'AI Agent',ts:Date.now(),data:{对齐AC:t.acs,验证方式:t.verify},selfReport:'测试已编写'});
      const ta=s.artifacts[s.artifacts.length-1]; ta.file=buildFile(ta);
      s.aiSuggestions++;
      log(s,'ai','TEST_WRITTEN',t.id,'先写测试 · 对齐 '+t.acs.join(','));
      n++;
      if(which==='test') return {ok:true,msg:t.id+' 已提交测试代码 · 下一步：工具链回传红阶段结果'};
    }
    if(which==='impl'||which==='all'){
      if(!st.red) return {ok:false,msg:'TDD 顺序：需先由工具链回传「红」阶段测试证据，AI 才能写实现'};
      if(!st.impl){
        st.impl=true;
        const out=t.diff.filter(f=>t.scope.indexOf(f)<0);
        s.outOfScope[t.id]={files:out,explanation:''};
        s.artifacts.push({id:nid(s,'A'),phase:'G4',kind:'ai',type:'diff',title:t.id+' 实现 Diff + 变更说明',version:1,
          hash:hash(t.id+JSON.stringify(t.diff)+s.round),producer:'AI Agent',ts:Date.now(),
          data:{目标:t.title,改动文件:t.diff,计划内文件:t.scope,越界文件:out,变更说明:'按 Task 实现'},selfReport:'已自测全绿（不构成证据）'});
        const da=s.artifacts[s.artifacts.length-1]; da.file=buildFile(da);
        s.aiSuggestions++;
        log(s,'ai','DIFF_SUBMITTED',t.id,'提交 Diff · 文件 '+t.diff.length+' 个'+(out.length?' · 检出越界 '+out.join(','):''));
        n++;
      }
    }
    return n?{ok:true,msg:t.id+' 完成 '+n+' 项 AI 动作 · 下一步：工具链回传绿测与越界检测'}
            :{ok:false,msg:'本 Task 的 AI 动作已全部完成，等待其他主体'};
  }
  function toolTaskAction(s,role,which,taskId){
    const p=cur(s);
    if(!p||p.id!=='G4') return {ok:false,msg:'仅 G4 实现循环可回传测试与检测证据'};
    if(role!=='toolchain') return deny(s,role,'签名回传测试 / 检测结果',p.id);
    const t=taskId?taskById(s,taskId):currentTask(s);
    if(!t) return {ok:false,msg:'所有 Task 已完成'};
    if(s.escalated[t.id]) return {ok:false,msg:'该 Task 已熔断冻结，请人先裁决'};
    const st=s.taskStep[t.id],tid=t.id;
    let n=0;
    if((which==='red'||which==='all') && !st.red){
      if(!st.test) return {ok:false,msg:'等待 AI Agent 先写测试'};
      st.red=true;
      s.evidences.push({id:nid(s,'V'),phase:'G4',kind:'task',taskId:tid,type:'verify_red',title:'单测结果：红（预期失败）',
        source:'toolchain',signer:'ci-runner-01',commitHash:hash(tid+'red'+s.round),diffHash:hash(tid+'diff'+s.round),
        result:'FAIL(EXPECTED)',ts:Date.now(),data:{阶段:'TDD 红',失败:'实现尚未存在'}});
      log(s,'toolchain','EVIDENCE_SIGNED',tid,'TDD 红阶段：测试失败（预期）');
      n++;
      if(which==='red') return {ok:true,msg:tid+' 红阶段证据已签名 · 下一步：AI Agent 写实现'};
    }
    if((which==='green'||which==='all') && !st.green){
      if(!st.impl) return {ok:false,msg:'等待 AI Agent 提交实现 Diff'};
      st.green=true;
      s.evidences.push({id:nid(s,'V'),phase:'G4',kind:'task',taskId:tid,type:'verify_green',title:'单测 + Lint：绿',
        source:'toolchain',signer:'ci-runner-01',commitHash:hash(tid+'green'+s.round),diffHash:hash(tid+'diff'+s.round),
        result:'PASS',ts:Date.now(),data:{单测:'通过',Lint:'0 error',耗时:'12.4s'}});
      log(s,'toolchain','EVIDENCE_SIGNED',tid,'TDD 绿阶段：单测与 Lint 全绿');
      n++;
      if(which==='green') return {ok:true,msg:tid+' 绿测证据已签名 · 下一步：越界检测'};
    }
    if(which==='oos'||which==='all'){
      if(!s.evidences.some(e=>e.taskId===tid&&e.type==='out_of_scope')){
        if(!st.green) return {ok:false,msg:'等待绿测证据回传'};
        const out=(s.outOfScope[tid]||{files:[]}).files;
        s.evidences.push({id:nid(s,'V'),phase:'G4',kind:'task',taskId:tid,type:'out_of_scope',title:'越界改动检测报告',
          source:'toolchain',signer:'ci-runner-01',commitHash:hash(tid+'oos'+s.round),diffHash:hash(tid+'diff'+s.round),
          result:out.length?'WARN':'PASS',ts:Date.now(),data:{比对:'Diff 文件集 − Plan 改动清单',越界文件:out,处理:out.length?'需人工填写说明':'无需说明'}});
        log(s,'toolchain','EVIDENCE_SIGNED',tid,out.length?'越界检测：发现 '+out.join(',')+'，需人工说明':'越界检测：无越界改动');
        n++;
      }
    }
    return n?{ok:true,msg:tid+' 完成 '+n+' 项工具链签名 · 下一步：人 Review Diff'}
            :{ok:false,msg:'当前可签名的证据已齐备，等待人 Review'};
  }
  function simulateFail(s,role,taskId){
    const p=cur(s);
    if(!p||p.id!=='G4') return {ok:false,msg:'失败熔断仅作用于 G4 实现循环'};
    if(role!=='toolchain') return deny(s,role,'模拟自测失败',p.id);
    const t=taskId?taskById(s,taskId):currentTask(s);
    if(!t) return {ok:false,msg:'没有进行中的 Task'};
    s.failCount[t.id]=(s.failCount[t.id]||0)+1;
    log(s,'toolchain','SELFTEST_FAILED',t.id,'自测失败第 '+s.failCount[t.id]+' 次（上限 '+FAIL_LIMIT+'）');
    if(s.failCount[t.id]>=FAIL_LIMIT){
      s.escalated[t.id]=true;
      log(s,'system','ESCALATED',t.id,'失败即停：超过 '+FAIL_LIMIT+' 次，Task 冻结，升级人裁决');
      return {ok:true,msg:'失败已达 '+FAIL_LIMIT+' 次，Task 已熔断冻结，请人裁决'};
    }
    return {ok:true,msg:'模拟自测失败 '+s.failCount[t.id]+'/'+FAIL_LIMIT+' 次'};
  }
  function arbitrate(s,role,taskId){
    if(role!=='human') return deny(s,role,'裁决熔断异常','G4');
    const t=taskId?taskById(s,taskId):currentTask(s);
    if(!t) return {ok:false,msg:'没有进行中的 Task'};
    s.escalated[t.id]=false; s.failCount[t.id]=0;
    log(s,'human','HUMAN_ARBITRATION',t.id,'人裁决：重置失败计数，允许继续实现');
    return {ok:true,msg:'人已裁决 '+t.id+'，熔断解除'};
  }
  function explainOutOfScope(s,role,text,taskId){
    if(role!=='human') return deny(s,role,'填写越界改动说明','G4');
    const t=taskId?taskById(s,taskId):currentTask(s);
    if(!t) return {ok:false,msg:'没有进行中的 Task'};
    const o=s.outOfScope[t.id];
    if(!o||!o.files.length) return {ok:false,msg:'当前 Task 没有越界改动'};
    const v=String(text||'').trim();
    if(!v) return {ok:false,msg:'必须填写越界改动的理由'};
    o.explanation=v;
    log(s,'human','OUT_OF_SCOPE_EXPLAINED',t.id,'越界文件 '+o.files.join(',')+' · 人工说明：'+v);
    return {ok:true,msg:t.id+' 越界说明已留痕'};
  }
  /* 独立评审：人可以对**任意**已产出 Diff 的 Task 签字，不必等前一个 Task 走完。
     taskId 缺省时退回当前游标（兼容旧调用），有值时以它为准。
     签字只影响该 Task 自身；G4 门禁要求所有 Task 都签完才解锁。 */
  function reviewTask(s,role,decision,note,taskId){
    if(role!=='human') return deny(s,role,'Review Diff',(cur(s)||{id:'G4'}).id);
    const t=taskId?taskById(s,taskId):currentTask(s);
    if(!t) return {ok:false,msg:'所有 Task 已完成'};
    const st=s.taskStep[t.id];
    if(!st.green||!st.impl) return {ok:false,msg:t.id+' 尚未完成 TDD 与证据回传，请先恢复自动执行'};
    if(s.escalated[t.id]) return {ok:false,msg:t.id+' 已熔断，请先由人裁决'};
    const o=s.outOfScope[t.id];
    if(o&&o.files.length&&!o.explanation&&decision==='ok')
      return {ok:false,msg:t.id+' 越界改动未说明：'+o.files.join(',')+' · 请先填写理由'};
    if(decision==='ok'){
      st.review='ok';
      // 游标只在签字后推进到下一个未签字的 Task；已签字的 Task 记录在 st.review 上，不再依赖游标
      while(s.taskIdx<s.tasks.length&&s.taskStep[s.tasks[s.taskIdx].id]&&s.taskStep[s.tasks[s.taskIdx].id].review==='ok') s.taskIdx++;
      const left=s.tasks.filter(x=>!(s.taskStep[x.id]&&s.taskStep[x.id].review==='ok'));
      log(s,'human','DIFF_REVIEWED',t.id,'Review 通过 · 已签字'+(left.length?' · 另有 '+left.length+' 个 Task 独立待审':''));
      return {ok:true,msg:t.id+' Diff 通过人 Review'+(left.length
        ?' · 还有 '+left.length+' 个 Task 待独立评审（'+left.map(x=>x.id).join('、')+'）'
        :' · 全部 '+s.tasks.length+' 个 Task 已签字，可审批 G4 门禁')};
    }
    const text=String(note||'').trim()||'实现超出 Task 范围';
    st.review='rejected'; st.impl=false; st.green=false;
    s.evidences=s.evidences.filter(e=>!(e.taskId===t.id&&e.type==='out_of_scope'));
    const o2=s.outOfScope[t.id]; if(o2)o2.explanation='';
    s.reviewNotes.push({pid:'G4/'+t.id,reason:text,ts:Date.now()});
    s.memories.push({id:nid(s,'M'),text:'约束：'+t.id+' 出现「'+text+'」时，AI 修订前须自查并规避',status:'candidate',source:'G4/'+t.id+' 打回',category:'历史教训',scope:t.id,hits:0,round:s.round,ts:Date.now()});
    log(s,'human','DIFF_REJECTED',t.id,'打回意见：'+text+' · 已生成候选记忆');
    return {ok:true,msg:t.id+' 已打回，已授权 AI 按意见自动修订'};
  }
  function confirmMemory(s,id,role){
    if(role!=='human') return deny(s,role,'确认记忆入库','G10');
    const m=s.memories.find(x=>x.id===id);
    if(!m) return {ok:false,msg:'未找到该记忆条目'};
    m.status='active';
    log(s,'human','MEMORY_CONFIRMED',m.id,'规则已入库：'+m.text);
    return {ok:true,msg:'已确认入库，下轮 G0 将注入该约束'};
  }
  function revokeMemory(s,id,role){
    if(role!=='human') return deny(s,role,'否决记忆条目','G10');
    const m=s.memories.find(x=>x.id===id);
    if(!m) return {ok:false,msg:'未找到该记忆条目'};
    m.status='revoked';
    log(s,'human','MEMORY_REVOKED',m.id,'规则被否决，不进入项目记忆');
    return {ok:true,msg:'已否决该候选规则'};
  }

  /* ---- 触发后自动执行：生成执行计划并逐步回放 ---- */
  /* G4 批次并发：一个 Task 一条独立的 TDD 链，链内顺序恒定（先测 → 红 → 实现 → 绿 → 越界 → 变更说明）。
     批次内各 Task 的链**交错**执行 = 并行推进：它们改的是互不重叠的文件，互不阻塞。
     每个 Task 的工具链证据独立绑定自己的 commit / diff hash，所以「谁的改动让测试变绿」始终可归属；
     跨 Task 的集成回归由 G5 的全量回归兜底。 */
  function g4TaskChain(s,t){
    const st=s.taskStep[t.id]||{test:false,red:false,impl:false,green:false,review:'pending'};
    const chain=[];
    const add=(actor,step,detail,dur,fn)=>chain.push({actor,step,detail,dur:dur||200,fn:fn||null,taskId:t.id});
    if(!st.test){
      add('ai','分析 Task','读取 '+t.id+' 目标、文件范围与验收标准 '+t.acs.join(',')+'；加载项目记忆 '+activeMemory(s).length+' 条',260);
      add('ai','检索代码库','定位相关实现与既有约定，标记风险点',340);
      add('ai','先写测试','按「'+t.verify+'」生成测试代码',520,'aiTest');
    }
    if(!st.red){
      add('system','移交工具链',t.id+' 测试代码已提交，交由工具链执行',160);
      add('toolchain','执行测试（红）','运行单测：预期失败，确认测试有效',640,'toolRed');
    }
    if(!st.impl){
      // 被打回过 = 按人的意见修订；否则是 TDD 正常流程里的「红已就绪，该写实现」
      if(st.review==='rejected') add('ai','按意见修订实现','读取人打回原因，重新生成实现代码与 Diff',760,'aiImpl');
      else add('ai','写实现并提交 Diff','生成实现代码，输出 '+t.diff.length+' 个改动文件',880,'aiImpl');
    }
    if(!st.green) add('toolchain','单测 + Lint（绿）','单测与 Lint 全绿',680,'toolGreen');
    if(!s.evidences.some(e=>e.taskId===t.id&&e.type==='out_of_scope'))
      add('toolchain','越界改动检测','比对 Diff 文件集 − Plan 改动清单',330,'toolOos');
    if(st.impl||st.green) add('ai','整理变更说明','汇总 Diff、覆盖的验收标准与自报结论（自报不采信）',220);
    const out=(s.outOfScope[t.id]||{files:[]}).files;
    if(out.length&&!s.outOfScope[t.id].explanation) add('system','检出越界改动','需人填写说明：'+out.join(','),140);
    return chain;
  }
  function buildRunPlan(s){
    const p=cur(s);
    if(!p) return [];
    const plan=[];
    const add=(actor,step,detail,dur,fn,taskId)=>plan.push({actor,step,detail,dur:dur||200,fn:fn||null,taskId:taskId||null});
    if(p.id==='G4'){
      const batch=readyBatch(s);
      if(!batch.length) return [];
      // round-robin 交错：批次内各 Task 的链并行推进，但每条链内部顺序不变
      const chains=batch.map(t=>g4TaskChain(s,t));
      const maxLen=Math.max.apply(null,chains.map(c=>c.length).concat([0]));
      for(let i=0;i<maxLen;i++) chains.forEach(c=>{ if(c[i]) plan.push(c[i]); });
      return plan;
    }
    const mem=activeMemory(s).length;
    if(!s.artifacts.some(a=>a.phase===p.id&&a.kind==='ai')){
      add('ai','加载上下文','读取项目记忆 '+mem+' 条 · 加载代码库索引 · 应用既有约定',340);
      add('ai','检索代码库','定位相关文件与历史约束，标记风险点',480);
      add('ai','生成结构化产出','输出 '+p.ai,760,'aiSubmit');
      add('ai','自我检查','对照验收标准逐条自查，附自报「已自测全绿」（系统不采信）',300);
    }
    if(!s.evidences.some(e=>e.phase===p.id&&e.kind==='stage')){
      add('toolchain','执行机器验证','运行测试 / 静态检查 / 覆盖率 / 一致性扫描',700);
      add('toolchain','签名回传证据','ci-runner-01 签名，绑定 commit / diff hash',280,'toolSubmit');
    }
    return plan;
  }
  /* 授权单预览：算出「批准后实际会跑哪几步」，只读，不改状态。
     临时推进 phaseIdx 生成计划后立即还原，供审批人在签字前看清授权范围。 */
  function previewNextRun(s){
    const nx=PHASES[s.phaseIdx+1];
    if(!nx) return [];
    const keep=s.phaseIdx;
    let plan=[];
    try{ s.phaseIdx++; plan=buildRunPlan(s); }
    catch(e){ plan=[]; }
    finally{ s.phaseIdx=keep; }
    return plan;
  }
  /* G4 内层：预览「人签字后将自动跑哪几步」，只读，不改状态。
     批次语义：把**当前待评审**的 Task 临时视为已签字，再算下一批计划，然后还原。
     若当前没有待评审的 Task，则预览的就是仍在执行中的批次的剩余步骤。 */
  function previewNextTaskRun(s){
    if(!cur(s)||cur(s).id!=='G4') return [];
    const sign=tasksAwaitingReview(s).map(t=>t.id);
    const keep=JSON.parse(JSON.stringify(s.taskStep));
    let plan=[];
    try{
      sign.forEach(id=>{ if(s.taskStep[id]) s.taskStep[id].review='ok'; });
      plan=buildRunPlan(s);
    }
    catch(e){ plan=[]; }
    finally{ s.taskStep=keep; }
    return plan;
  }
  /* ---- 执行凭证：AI / 工具链每一步的「谁 / 何时 / 输入 / 怎么加载 / 输出 / 关联」 ----
     所有输入都在执行那一刻从真实状态读取，不硬编码内容；未接入的数据显式标注，不伪造。 */
  function inp(kind,label,source,items,extra){
    return Object.assign({kind,label,source,count:items.length,items},extra||{});
  }
  function memItems(s){
    return activeMemory(s).map(m=>({id:m.id, category:m.category||'未分类', text:m.text,
      source:m.source, scope:m.scope, hits:m.hits||0, round:m.round, status:m.status}));
  }
  function describeStep(s,st,ctx){
    const p=cur(s)||{id:'DONE',name:'已完成',todo:[],criteria:[],gate:'',ai:'',ev:''};
    // 并发执行时每个步骤归属各自的 Task，不依赖全局游标
    const t=st.taskId?taskById(s,st.taskId):currentTask(s), pid=p.id;
    const mem=memItems(s);
    const artOf=phase=>s.artifacts.filter(a=>a.phase===phase&&a.kind==='ai').map(a=>({id:a.id,title:a.title,hash:a.hash,file:a.file?a.file.path:null}));
    const evOf=phase=>s.evidences.filter(e=>e.phase===phase&&e.kind==='stage').map(e=>({id:e.id,title:e.title,result:e.result,diffHash:e.diffHash}));
    const inputs=[inp('phase_def','阶段定义（本步骤的依据）','LOGIC.PHASES['+s.phaseIdx+']',
      [{id:p.id,name:p.name,gate:p.gate,ai:p.ai,ev:p.ev,todo:p.todo,criteria:p.criteria}])];
    const generic={tool:(ACTORS[st.actor]||ACTORS.system).runtime, operation:st.step,
      params:{阶段:pid, 本轮:s.round}, basis:'《AI开发流程设计》2.3 各阶段 AI 职责 / 产出物 / 门禁'};
    let method=generic, note='';

    if(st.step==='加载上下文'||st.step==='分析 Task'){
      inputs.push(inp('project_memory','项目记忆 · 生效条目','S.memories[]',mem,{
        categories:MEMORY_CATEGORIES.map(c=>({name:c, loaded:mem.filter(m=>m.category===c).length,
          note:c==='历史教训'?'由 G10 经验回流产生，本原型真实写入':'属项目基线，本原型未接入外部知识库，不伪造条目'})),
        selector:'status === "active" && round <= S.round', orderBy:'hits DESC, id ASC',
        injectedInto:'Context Brief.已加载项目记忆'}));
      if(s.acs.length) inputs.push(inp('acceptance_criteria','验收标准 AC','S.acs[]',s.acs.map(a=>({id:a.id,text:a.text,testable:a.testable}))));
      if(s.plan&&s.plan.files) inputs.push(inp('plan_files','Plan 改动文件清单','S.plan.files',s.plan.files.map(f=>({path:f}))));
      if(s.tasks.length) inputs.push(inp('tasks','Task 清单','S.tasks[]',s.tasks.map(x=>({id:x.id,title:x.title,scope:x.scope,acs:x.acs,verify:x.verify}))));
      method={tool:'项目记忆加载器 / 上下文注入（演示模拟适配器）',
        operation:'读取生效项目记忆 → 按阶段与命中排序 → 注入本阶段上下文',
        selector:'S.memories[] 中 status="active" 且 round<=当前轮', orderBy:'hits DESC, id ASC',
        injectedInto:'Context Brief.已加载项目记忆',
        params:{阶段:pid, 本轮:s.round, 生效条目数:mem.length, 分类口径:MEMORY_CATEGORIES,
          同时读取:['S.acs[]','S.plan.files','S.tasks[]','LOGIC.PHASES['+s.phaseIdx+']']},
        basis:'《AI开发流程设计》2.3 G0「AI 加载项目记忆（约束、编码规范、历史教训）；检索相关代码与文档」'};
      note='项目记忆按文档分三类；本原型只真实承载「历史教训」（打回与复盘回流），其余两类需接项目基线，故如实显示为 0 条。';
    }else if(st.step==='检索代码库'){
      const brief=s.artifacts.find(a=>a.phase==='G0'&&a.kind==='ai');
      const loc=(brief&&brief.data&&brief.data.代码位置)||(s.plan&&s.plan.files)||(t?t.scope:[]);
      inputs.push(inp('code_locations','代码库索引命中位置',brief?'G0 Context Brief.data.代码位置':(s.plan?'S.plan.files':'S.tasks[].scope'),
        loc.map(f=>({path:f}))));
      if(brief&&brief.data) inputs.push(inp('conventions','既有约定 / 风险点','G0 Context Brief.data',
        [{既有约定:brief.data.既有约定,风险点:brief.data.风险点}]));
      method={tool:'代码库索引检索（演示模拟适配器）',operation:'按阶段范围检索相关文件与既有约定',
        params:{索引版本:'idx-'+hash('G0'+s.round), 命中文件数:loc.length, 阶段:pid},
        basis:'《AI开发流程设计》2.3 G0「检索相关代码与文档」'};
    }else if(st.step==='生成结构化产出'||st.step==='自我检查'){
      inputs.push(inp('target_artifact','本阶段应产出','LOGIC.PHASES['+s.phaseIdx+']',[{type:p.ai,标准:p.criteria}]));
      const prev=s.phaseIdx>0?artOf(PHASES[s.phaseIdx-1].id):[];
      if(prev.length) inputs.push(inp('upstream_artifacts','上游阶段工件（作为输入）','S.artifacts[]',prev));
      if(s.acs.length) inputs.push(inp('acceptance_criteria','验收标准 AC','S.acs[]',s.acs.map(a=>({id:a.id,testable:a.testable}))));
      method={tool:(ACTORS.ai.runtime)+' · 结构化产出生成器',
        operation:st.step==='自我检查'?'对照 AC 逐条自查并附自报声明（系统不采信）':'按阶段定义生成结构化文档并登记模拟文件',
        params:{阶段:pid, 输出类型:p.ai, 上游工件数:prev.length},
        basis:'《AI开发流程设计》2.3 各阶段「AI 职责 / 产出物」'};
      if(st.step==='自我检查') note='AI 自报「已自测全绿」不构成证据，仅作提示；门禁只认工具链签名证据。';
    }else if(st.step==='执行机器验证'||st.step==='签名回传证据'){
      inputs.push(inp('verification_scope','机器验证范围','LOGIC.PHASES['+s.phaseIdx+']',[{证据类型:p.ev,判据:p.criteria}]));
      inputs.push(inp('artifacts_under_test','待验证工件','S.artifacts[]',artOf(pid)));
      if(ctx.newEvs.length) inputs.push(inp('evidence_payload','签名载荷','S.evidences[]（本步新建）',
        ctx.newEvs.map(e=>({id:e.id,result:e.result,commitHash:e.commitHash,diffHash:e.diffHash,data:e.data}))));
      method={tool:'ci-runner-01（演示模拟适配器）',
        operation:st.step==='签名回传证据'?'对验证结果签名，绑定 commit / diff hash 并回传':'运行测试 / 静态检查 / 覆盖率 / 一致性扫描',
        params:{阶段:pid, 签名者:'ci-runner-01', 绑定字段:['commitHash','diffHash','result']},
        basis:'《AI开发流程设计》2.5「AI 自报不算证据，工具链签名并绑定提交」'};
    }else if(st.step==='先写测试'){
      if(t) inputs.push(inp('task','当前 Task（测试依据）','S.tasks[id='+t.id+']',
        [{id:t.id,title:t.title,verify:t.verify,acs:t.acs,scope:t.scope,dependsOn:t.deps||[]}]));
      method={tool:(ACTORS.ai.runtime)+' · 测试生成器',operation:'先写测试并对齐 AC，等待工具链回传「红」',
        params:{TDD阶段:'红前', Task:t?t.id:null},basis:'《AI开发流程设计》2.5 TDD 纪律：先写测试，预期失败'};
    }else if(st.step==='写实现并提交 Diff'||st.step==='按意见修订实现'){
      if(t) inputs.push(inp('task_files','Task 文件范围与本次 Diff','S.tasks[id='+t.id+']',
        [{id:t.id,计划内文件:t.scope,改动文件:t.diff,越界文件:t.diff.filter(f=>t.scope.indexOf(f)<0)}]));
      const notes=s.reviewNotes.filter(n=>n.pid.indexOf('G4')===0);
      if(notes.length) inputs.push(inp('human_feedback','人的打回意见（修订依据）','S.reviewNotes[]',notes.map(n=>({pid:n.pid,reason:n.reason}))));
      const red=s.evidences.filter(e=>e.taskId===(t?t.id:'')&&e.type==='verify_red');
      if(red.length) inputs.push(inp('red_evidence','前置「红」阶段证据','S.evidences[]',red.map(e=>({id:e.id,result:e.result}))));
      method={tool:(ACTORS.ai.runtime)+' · 实现生成器',operation:'依据测试与反馈生成实现代码，输出 Diff + 变更说明',
        params:{Task:t?t.id:null, 改动文件数:t?t.diff.length:0},basis:'《AI开发流程设计》2.3 G4「先写测试 → 再写实现」'};
    }else if(st.step==='执行测试（红）'||st.step==='单测 + Lint（绿）'){
      const tst=s.artifacts.filter(a=>a.phase==='G4'&&a.type==='test_code'&&(!t||a.title.indexOf(t.id)===0));
      inputs.push(inp('test_code','待执行测试代码','S.artifacts[]',tst.map(a=>({id:a.id,title:a.title,hash:a.hash}))));
      if(ctx.newEvs.length) inputs.push(inp('test_result','本次执行结果（工具链签名）','S.evidences[]（本步新建）',
        ctx.newEvs.map(e=>({id:e.id,result:e.result,data:e.data}))));
      method={tool:'ci-runner-01（演示模拟适配器）',operation:'执行单测与 Lint 并签名回传结果',
        params:{TDD阶段:st.step.indexOf('红')>=0?'红（预期失败）':'绿（全绿）', Task:t?t.id:null},
        basis:'《AI开发流程设计》2.5 红绿测试证据由工具链产生'};
    }else if(st.step==='越界改动检测'){
      if(t){
        const out=t.diff.filter(f=>t.scope.indexOf(f)<0);
        inputs.push(inp('diff_vs_plan','Diff 文件集 − Plan 改动清单','S.tasks[].diff / .scope',
          [{计划内:t.scope,本次改动:t.diff,计划外改动:out}]));
      }
      if(ctx.newEvs.length) inputs.push(inp('oos_result','越界检测结果','S.evidences[]（本步新建）',
        ctx.newEvs.map(e=>({id:e.id,result:e.result,data:e.data}))));
      method={tool:'ci-runner-01 · 越界检测器（演示模拟适配器）',operation:'比对改动文件集与计划清单，命中则要求人说明',
        params:{Task:t?t.id:null},basis:'《AI开发流程设计》2.5 越界检测'};
    }else if(st.step==='移交工具链'||st.step==='检出越界改动'||st.step==='整理变更说明'){
      inputs.push(inp('handoff','移交 / 汇总所依据的当前状态','S',
        [{阶段:pid, 本阶段工件数:artOf(pid).length, 本阶段证据数:evOf(pid).length,
          Task:t?t.id:null, 越界:(s.outOfScope[t?t.id:'']||{files:[]}).files}]));
      method={tool:(ACTORS[st.actor]||ACTORS.system).runtime,operation:st.step,
        params:{阶段:pid},basis:'流程编排定义'};
    }else{
      note='该步骤由通用凭证兜底覆盖，确保任何自动动作都有可查记录。';
    }
    if(!ctx.newArts.length&&!ctx.newEvs.length&&!note) note='本步骤为读取 / 分析 / 编排，不产生工件或证据（已显式留痕）。';
    return {inputs,method,note};
  }
  function runStep(s,st){
    const p=cur(s),pid=p?p.id:'G4';
    const beforeArt=new Set(s.artifacts.map(a=>a.id));
    const beforeEv=new Set(s.evidences.map(e=>e.id));
    const startedAt=Date.now();
    let r=null;
    switch(st.fn){
      case 'aiSubmit': r=aiSubmit(s,'ai');break;
      case 'toolSubmit': r=toolSubmit(s,'toolchain');break;
      case 'aiTest': r=aiTaskAction(s,'ai','test',st.taskId);break;
      case 'aiImpl': r=aiTaskAction(s,'ai','impl',st.taskId);break;
      case 'toolRed': r=toolTaskAction(s,'toolchain','red',st.taskId);break;
      case 'toolGreen': r=toolTaskAction(s,'toolchain','green',st.taskId);break;
      case 'toolOos': r=toolTaskAction(s,'toolchain','oos',st.taskId);break;
    }
    const newArts=s.artifacts.filter(a=>!beforeArt.has(a.id));
    const newEvs=s.evidences.filter(e=>!beforeEv.has(e.id));
    const tr={id:nid(s,'TR'),ts:startedAt,actor:st.actor,phase:pid,step:st.step,detail:st.detail,
      durationMs:st.dur,status:(r&&r.ok===false)?'fail':'done',result:r?r.msg:''};
    // 反向关联：工件 / 证据 / 文件都能反查到产生它的那一步
    newArts.forEach(a=>{a.producedBy=tr.id;if(a.file)a.file.producedBy=tr.id;});
    newEvs.forEach(e=>{e.producedBy=tr.id;});
    const desc=describeStep(s,st,{newArts,newEvs,result:r});
    const eventId=log(s,st.actor,'AUTO_STEP',pid,'['+st.step+'] '+st.detail+(r?' → '+r.msg:''),
      {traceId:tr.id, actorId:(ACTORS[st.actor]||ACTORS.system).id, phase:pid});
    const memIds=desc.inputs.filter(i=>i.kind==='project_memory').reduce((n,i)=>n.concat(i.items.map(m=>m.id)),[]);
    tr.receipt={
      schema:'gk.receipt/1',
      who:Object.assign({},ACTORS[st.actor]||ACTORS.system,{stepSeq:s.traces.length+1}),
      when:{startedAt,endedAt:startedAt+(st.dur||0),durationMs:st.dur,clock:'浏览器本地时间'},
      where:{round:s.round,phaseIdx:s.phaseIdx,phase:pid,phaseName:p?p.name:'已完成',
        taskId:st.taskId||null,acIds:s.acs.map(a=>a.id),
        concurrency:st.taskId&&batchIds(s).indexOf(st.taskId)>=0?'本批次并行执行':null},
      what:{step:st.step,detail:st.detail,fn:st.fn||null},
      method:desc.method, inputs:desc.inputs,
      outputs:newArts.map(a=>({kind:'artifact',id:a.id,title:a.title,hash:a.hash,type:a.type,
        file:a.file?a.file.path:null})).concat(newEvs.map(e=>({kind:'evidence',id:e.id,title:e.title,
        result:e.result,signer:e.signer,commitHash:e.commitHash,diffHash:e.diffHash}))),
      note:desc.note,
      refs:{traceId:tr.id,eventId,
        artifactIds:newArts.map(a=>a.id),evidenceIds:newEvs.map(e=>e.id),memoryIds:memIds,
        filePaths:newArts.map(a=>a.file?a.file.path:null).filter(Boolean),
        commitHash:newEvs.length?newEvs[0].commitHash:null,diffHash:newEvs.length?newEvs[0].diffHash:null},
      result:{status:tr.status,message:tr.result},
      simulated:(ACTORS[st.actor]||ACTORS.system).simulated,
    };
    s.traces.push(tr);
    return tr;
  }
  function receiptOk(t){
    const r=t.receipt;
    return !!(r&&r.who&&r.who.id&&r.when&&r.when.startedAt&&r.where&&r.method&&r.method.tool&&
      Array.isArray(r.inputs)&&r.inputs.length&&Array.isArray(r.outputs)&&
      r.refs&&r.refs.traceId===t.id&&r.refs.eventId&&r.result);
  }
  function metrics(s){
    const ap=s.approvals;
    const first=ap.filter(a=>a.attempt===1).length;
    const totalAttempts=ap.length+Object.keys(s.gateAttempts).reduce((n,k)=>n+(s.gateAttempts[k]-1),0);
    const avgDur=ap.length?ap.reduce((n,a)=>n+a.durationMs,0)/ap.length:0;
    const rejected=s.reviewNotes.length;
    const adopted=Math.max(0,s.aiSuggestions-rejected);
    return [
      {key:'门禁一次通过率',value:ap.length?Math.round(first/ap.length*100)+'%':'—',na:!ap.length,desc:'首次提交即通过的门禁 / 已批准门禁。来源：事件日志（真实）'},
      {key:'需求返工率',value:totalAttempts?Math.round(s.reworks/totalAttempts*100)+'%':'—',na:!totalAttempts,desc:'G1/G2 打回次数 / 门禁提交总次数。代理指标，正式口径需接需求系统'},
      {key:'缺陷逃逸率',value:'待接入',na:true,desc:'原型不接入线上工单与缺陷系统 —— 属于边界之外，故留空'},
      {key:'AI 建议采纳率',value:s.aiSuggestions?Math.round(adopted/s.aiSuggestions*100)+'%':'—',na:!s.aiSuggestions,desc:'(AI 产出总数 − 打回次数) / AI 产出总数。代理指标'},
      {key:'人均 Review 耗时',value:ap.length?(avgDur/1000).toFixed(1)+'s':'—',na:!ap.length,desc:'AI 提交 → 人签字的审批停留时长。代理指标，演示环境为秒级'},
      {key:'执行可追溯率',value:s.traces.length?Math.round(s.traces.filter(receiptOk).length/s.traces.length*100)+'%':'—',na:!s.traces.length,
        desc:'带完整凭证（谁 / 何时 / 输入 / 加载方式 / 输出 / 关联）的自动步骤占比。来源：traces（真实）'},
    ];
  }
  function nextRound(s,role){
    if(role!=='human') return deny(s,role,'开启新一轮','G0');
    const carried=activeMemory(s).map(m=>Object.assign({},m,{hits:(m.hits||0)+1}));
    const ns=createState(s.round+1,carried);
    log(ns,'system','MEMORY_INJECTED','G0','下轮 G0 已自动加载 '+carried.length+' 条生效项目记忆');
    return ns;
  }

  /* ---- 闭环后开启下一轮 = 新建一个任务，而不是把当前任务重置 ----
     《AI开发流程设计》2.1：「项目记忆（约束、偏好、历史教训）持久化，跨任务复用」。
     记忆跨任务复用 ⇒ 载体也该跨任务。所以下一轮是**一个新任务实例**（新 ID、
     独立的状态/工件/证据/审批/事件），把已确认入库的生效记忆继承过去；
     原任务保持「已闭环」原样不动，历史工件与审计轨迹完整保留、可随时回查。
     若沿用旧做法（同一 ID 重置 state），第 1 轮的工件与凭证会被覆盖丢失，
     且总览里也看不出「这是一个新任务」。 */
  function createNextTask(root,from,role,opts){
    opts=opts||{};
    if(role!=='human') return deny((from&&from.state)||root,role,'开启下一轮','G0');
    if(!from||!from.state) return {ok:false,msg:'未找到源任务'};
    const carried=activeMemory(from.state).map(m=>Object.assign({},m,{hits:(m.hits||0)+1}));
    const id='TASK-'+(root.nextId++);
    // 默认名：源任务名若已带「· 第 N 轮」标记就不再叠加，否则补上轮次（避免出现「第 1 轮 · 第 2 轮」）
    const rn=from.state.round+1;
    const baseName=opts.name||(/(^|·\s*)第\s*\d+\s*轮/.test(from.name)?from.name:(from.name+' · 第 '+rn+' 轮'));
    const st=createState(from.state.round+1,carried);
    // 血缘：新任务记录自己派生自哪个任务、旧任务记下派生了谁，两头都能反查
    st.parentTaskId=from.id;
    st.parentRound=from.state.round;
    const inst={id,name:baseName,
      desc:(opts.desc||('派生自 '+from.id+'（第 '+from.state.round+' 轮）· 继承 '+carried.length+' 条生效项目记忆')),
      owner:opts.owner||from.owner, createdAt:Date.now(), state:st};
    from.derivedTasks=(from.derivedTasks||[]);
    from.derivedTasks.push(id);
    log(st,'system','MEMORY_INJECTED','G0','新任务 '+id+' 由 '+from.id+' 派生；G0 自动加载 '+carried.length+' 条生效项目记忆');
    log(st,'system','TASK_DERIVED','G0','由 '+from.id+' 闭环后新建 · 源任务保持已闭环留档');
    return {ok:true,msg:'已新建 '+id+'（'+baseName+'）· 继承 '+carried.length+' 条生效项目记忆 · G0 从头开始',instance:inst};
  }

  /* ---- 存档迁移：把旧版本状态补齐到当前数据结构，保留已推进的进度 ----
     v0.8 起 tasks[].deps 表达「前置 Task 签字后才开工」，旧存档里没有这个字段，
     直接读会让 depsSatisfied 判定为「无依赖」，导致本该阻塞的 Task 被并发拉起。
     这里按 TASK_TEMPLATE 的 id 回填依赖，并补齐缺省字段。 */
  function migrateState(s){
    if(!s||!Array.isArray(s.tasks))return s;
    const byId={}; TASK_TEMPLATE.forEach(t=>{byId[t.id]=t;});
    s.tasks.forEach(t=>{
      const ref=byId[t.id];
      if(!Array.isArray(t.deps)) t.deps = ref ? (ref.deps||[]).slice() : [];
      if(!Array.isArray(t.scope)) t.scope=[];
      if(!Array.isArray(t.acs)) t.acs=[];
      if(!Array.isArray(t.diff)) t.diff=[];
    });
    s.taskStep=s.taskStep||{}; s.failCount=s.failCount||{}; s.escalated=s.escalated||{};
    s.outOfScope=s.outOfScope||{}; s.reviewNotes=s.reviewNotes||[];
    s.tasks.forEach(t=>{
      const st=s.taskStep[t.id]=s.taskStep[t.id]||{test:false,red:false,impl:false,green:false,review:'pending',verify:false};
      ['test','red','impl','green','verify'].forEach(k=>{ if(typeof st[k]!=='boolean') st[k]=false; });
      if(!st.review) st.review='pending';
      if(typeof s.failCount[t.id]!=='number') s.failCount[t.id]=0;
      if(typeof s.escalated[t.id]!=='boolean') s.escalated[t.id]=false;
    });
    return s;
  }

  /* ---- 多任务种子：全部用上面的真实流程逻辑推进，不伪造状态 ---- */
  function stepCurrent(s,confirmMem){
    const p=cur(s);
    if(!p)return;
    if(p.id==='G4'){
      // 批次循环：跑完当前批次 → 逐 Task 签字（模拟人已评审）→ 依赖解锁后进入下一批次
      let guard=0;
      while(guard++<20){
        const batch=readyBatch(s);
        if(!batch.length) break;
        buildRunPlan(s).forEach(x=>runStep(s,x));
        // 批次内每个 Task 各自处理越界说明与签字
        let progressed=false;
        batch.forEach(t=>{
          const o=s.outOfScope[t.id];
          if(o&&o.files.length&&!o.explanation) explainOutOfScope(s,'human','遗留耦合模块需同步修正错误码映射',t.id);
          const r=reviewTask(s,'human','ok','',t.id);
          if(r&&r.ok) progressed=true;
        });
        if(!progressed) break;
      }
    }else{
      buildRunPlan(s).forEach(x=>runStep(s,x));
      if(p.id==='G10'&&confirmMem) s.memories.filter(m=>m.status==='candidate').forEach(m=>confirmMemory(s,m.id,'human'));
    }
  }
  function drive(s,untilIdx,leavePending){
    let guard=0;
    while(s.phaseIdx<untilIdx&&guard++<20){
      stepCurrent(s,true);
      if(!approve(s,'human').ok)break;
    }
    if(leavePending&&s.phaseIdx===untilIdx&&cur(s)) stepCurrent(s,false);
  }
  function createSeedRoot(){
    const root={version:2,nextId:1101,instances:[],activeId:null};
    const mk=(id,name,desc,owner,setup)=>{
      const st=createState(1,[]);
      setup(st);
      const inst={id,name,desc,owner,createdAt:Date.now(),state:st};
      root.instances.push(inst);
      return inst;
    };
    const a=mk('TASK-1042','短信验证码登录','新增手机号验证码登录，兼容原密码登录','张工',st=>drive(st,1,true));
    const b=mk('TASK-1038','订单导出性能优化','大批量导出超时，需分页与异步化','李工',st=>{
      stepCurrent(st,true); approve(st,'human');
      stepCurrent(st,true); reject(st,'human','验收标准缺少异常场景判据');
      stepCurrent(st,true); approve(st,'human');
      drive(st,3,true);
    });
    // 支付回调幂等改造：批次并发跑到一半，T2 连续自测失败触发「失败即停」熔断，等待人裁决。
    // 熔断发生在 T2 执行途中（不是事后），所以裁决后确实还有活要继续 —— 与并发模型一致。
    const c=mk('TASK-1051','支付回调幂等改造','重复回调导致重复入账，需幂等键','王工',st=>{
      drive(st,4,false);
      // 只跑到批次中 T2 的红阶段之前，让 T2 停在半途
      const plan=buildRunPlan(st);
      const cut=plan.findIndex(x=>x.taskId==='T2'&&x.fn==='toolRed');
      plan.slice(0,cut<0?plan.length:cut).forEach(x=>runStep(st,x));
      // T2 连续三次自测失败 → 熔断冻结，升级人裁决
      simulateFail(st,'toolchain','T2'); simulateFail(st,'toolchain','T2'); simulateFail(st,'toolchain','T2');
    });
    const d=mk('TASK-1029','用户中心权限重构','角色模型由二级改为多级，需回归全部权限点','陈工',st=>drive(st,7,true));
    const e=mk('TASK-1060','搜索联想词迭代','联想词召回策略调整，补齐埋点','赵工',st=>drive(st,10,true));
    const f=mk('TASK-0998','日志采集链路接入','统一日志格式并接入集中检索','周工',st=>drive(st,11,false));
    // 记忆回流验证（真实两段）：源任务走完一整轮并在 G10 确认记忆 → 闭环留档；
    // 再由它派生一个**新任务**（新 ID、独立状态），新任务 G0 真实加载继承的生效记忆。
    // 这样「加载项目记忆」的凭证里能看到真实条目，而不是伪造基线数据；
    // 同时演示「闭环后新建任务，而不是把当前任务重置重跑」。
    const g=mk('TASK-0977','短信验证码登录 · 第 1 轮','完成一轮复盘并确认记忆后闭环留档，作为派生下一轮的源任务','吴工',st=>{
      drive(st,11,false);
    });
    const g2=createNextTask(root,g,'human',{name:'短信验证码登录 · 第 2 轮'});
    const derived=g2.instance;
    root.instances.unshift(derived);
    // 派生任务的 G0 真实跑起来：加载继承的生效项目记忆并产出 Context Brief
    stepCurrent(derived.state,false);
    root.activeId=a.id;
    return root;
  }
  return {PHASES,ACTORS,MEMORY_CATEGORIES,FAIL_LIMIT,hash,createState,cur,activeMemory,currentTask,autoCheck,aiSubmit,toolSubmit,buildFile,receiptOk,
    approve,reject,aiTaskAction,toolTaskAction,simulateFail,arbitrate,explainOutOfScope,reviewTask,
    confirmMemory,revokeMemory,buildRunPlan,previewNextRun,previewNextTaskRun,runStep,metrics,nextRound,createNextTask,createSeedRoot,log,
    taskById,readyBatch,batchIds,allTasksReviewed,tasksAwaitingReview,depsSatisfied,filesOverlap,g4TaskChain,
    migrateState};
})();
// ---- UI ----
</script>

<script>
(function(){
  const KEY='gatekeeper-prototype-v6';
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');};
  const WS={
    human:{title:'人 · 工作台',duty:'<b>系统只向人提供操作</b><br>我的动作：批准（= 授权下一阶段）/ 打回 / Review / 越界说明 / 裁决 / 记忆确认 / 开启下一轮<br><b>随时可查</b>：执行追溯（每步凭证）、模拟文件、全量事件日志',
      tabs:[['desk','审批台'],['receipt','执行追溯'],['review','循环 Review'],['memory','记忆确认'],['state','状态'],['artifacts','工件'],['evidences','证据'],['metrics','度量'],['log','事件日志']]},
    ai:{title:'AI 执行观测',duty:'<b>只读观测区</b><br>展示 AI 被触发后的自动执行过程（模拟）、每步完整凭证、产出的工件与模拟文件、注入的项目记忆。<br><b>本区没有任何流程动作按钮</b>，但每步都可点开凭证与文件查看。',
      tabs:[['trace','执行过程'],['receipt','执行凭证'],['artifacts','AI 工件'],['memory','注入记忆'],['state','流程状态']]},
    toolchain:{title:'工具链观测',duty:'<b>只读观测区</b><br>展示机器验证的执行记录、每步完整凭证与签名证据。<br><b>本区没有任何流程动作按钮</b>，但每步都可点开凭证查看输入与签名载荷。',
      tabs:[['trace','执行记录'],['receipt','执行凭证'],['evidences','签名证据'],['state','流程状态']]},
  };
  let ROOT,S,VIEW='overview',TAB='desk',PLAY=null;
  let RCP_SEL=null,RCP_ACTOR='all',RCP_Q='',RCP_KIND=null,RCP_FOCUS=null,FILE_ID=null;
  function load(){try{const r=localStorage.getItem(KEY);if(r){const x=JSON.parse(r);if(x&&x.version===2&&x.instances&&x.instances.length){
    // v0.8：Task 依赖图为新增字段，对旧存档做结构迁移（保留已推进的进度，不丢用户数据）
    x.instances.forEach(i=>{ if(i.state) LOGIC.migrateState(i.state); });
    return x; }}}catch(e){}return null;}
  ROOT=load()||LOGIC.createSeedRoot();
  function activeInst(){return ROOT.instances.find(i=>i.id===ROOT.activeId)||ROOT.instances[0];}
  function syncCurrent(){const i=ROOT.instances.find(x=>x.id===ROOT.activeId);if(i)i.state=S;}
  function save(){syncCurrent();try{localStorage.setItem(KEY,JSON.stringify(ROOT));}catch(e){}}
  S=activeInst().state;

  let toastTimer;
  function toast(msg,ok){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(ok?'ok':'no');t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',3400);}
  /* 人的一次判断 = 状态变更 + 对后续自动执行的授权。
     成功且确实还有可自动执行的动作时，直接启动回放，不再要求人补一次「触发」。 */
  function dispatch(fn,autoReason,autoAction){
    const r=fn();toast(r.msg,!!r.ok);
    if(r.ok&&autoReason&&startAutoRun(autoReason,autoAction))return;
    save();render();
  }
  function head(title,desc){return '<div class="page-head"><h1>'+esc(title)+'</h1><p>'+desc+'</p></div>';}
  function ro(){return ' <span class="ro">只读</span>';}

  /* ============ 总览页 ============ */
  function pendingFor(st){
    if(st.finishedAt)return null;
    if(st.tasks&&st.tasks.some&&st.tasks.some(t=>st.escalated[t.id]))return '失败熔断待人裁决';
    // 正常流转不会残留未执行的计划；若出现，说明自动执行被刷新中断，需要人恢复
    if(LOGIC.buildRunPlan(st).length)return '自动执行中断，待人工恢复';
    const p=LOGIC.cur(st);
    if(!p)return null;
    if(p.id==='G10'&&st.memories.some(m=>m.status==='candidate'))return 'G10 候选记忆待人确认';
    if(p.id==='G4'){
      const pend=LOGIC.tasksAwaitingReview(st);
      const frozen=st.tasks.filter(t=>st.escalated[t.id]);
      if(frozen.length) return frozen.map(t=>t.id).join('、')+' 失败熔断待人裁决';
      if(pend.length){
        const need=pend.filter(t=>{const o=st.outOfScope[t.id];return o&&o.files.length&&!o.explanation;});
        if(need.length) return need.map(t=>t.id).join('、')+' 越界改动待人说明';
        return pend.map(t=>t.id).join('、')+(pend.length>1?' 等 '+pend.length+' 个 Task 各自待 Review':' Diff 待人 Review');
      }
      return 'G4 '+st.tasks.length+' 个 Task 已签完，待人批准门禁';
    }
    return LOGIC.autoCheck(st).passed?('等待人签署 '+p.id+' 门禁'):'存在未满足校验项，待人处理';
  }
  function instStatus(st){
    if(st.finishedAt)return ['已闭环','green','finished'];
    if(st.tasks&&st.tasks.some&&st.tasks.some(t=>st.escalated[t.id]))return ['异常熔断','red','frozen'];
    const p=pendingFor(st);
    if(p)return ['待我处理','amber','pending'];
    return ['待自动执行','gray',''];
  }
  function miniProgress(st){
    return '<div class="mini">'+LOGIC.PHASES.map((p,i)=>'<span class="'+(i<st.phaseIdx?'done':i===st.phaseIdx?'now':'')+'"></span>').join('')+'</div>';
  }
  function lastEvent(st){
    const e=st.events[st.events.length-1];
    return e?'['+e.actor+'] '+e.detail:'';
  }
  function overviewPage(){
    const list=ROOT.instances;
    const running=list.filter(i=>!i.state.finishedAt);
    const done=list.filter(i=>i.state.finishedAt);
    const pend=list.filter(i=>pendingFor(i.state));
    const allAp=list.reduce((a,i)=>a.concat(i.state.approvals),[]);
    const once=allAp.length?Math.round(allAp.filter(a=>a.attempt===1).length/allAp.length*100)+'%':'—';
    const evTotal=list.reduce((n,i)=>n+i.state.events.length,0);
    let h=head('开发任务总览','每个任务都是一个独立的 G0–G10 流程实例 · 点「进入流程」查看该任务的状态、工件、证据与门禁');
    h+='<div class="notice info"><b>演示数据说明：</b>下面 '+list.length+' 个任务的进度不是写死的，全部由同一套流程逻辑真实推进生成（含工件、签名证据、门禁记录、执行过程与事件日志）；各任务记忆库相互隔离。</div>';
    h+='<div class="stats">'+
      '<div class="stat"><div class="k">进行中任务</div><div class="v">'+running.length+'</div><div class="d">未走完 G0–G10</div></div>'+
      '<div class="stat"><div class="k">待我处理</div><div class="v">'+pend.length+'</div><div class="d">门禁 / Review / 裁决 / 记忆确认</div></div>'+
      '<div class="stat"><div class="k">已闭环</div><div class="v">'+done.length+'</div><div class="d">11 道门禁全部签署</div></div>'+
      '<div class="stat"><div class="k">平均门禁一次通过率</div><div class="v">'+once+'</div><div class="d">汇总 '+allAp.length+' 次审批</div></div>'+
      '<div class="stat"><div class="k">事件日志总数</div><div class="v">'+evTotal+'</div><div class="d">跨任务不可变审计轨迹</div></div></div>';
    h+='<div class="card"><h3>新建开发任务</h3><div class="row"><input id="new-task-name" placeholder="输入任务名称，例如：优惠券核销接口改造" style="max-width:420px"><button class="primary" data-act="new-task">新建并进入流程</button></div>'+
      '<p class="hint">新任务从 G0 开始，状态、工件、证据、记忆完全独立。创建后会自动进入该任务的流程页面。</p></div>';
    h+='<div class="card"><h3>待我处理（'+pend.length+'）</h3>'+
      (pend.length?pend.map(i=>'<div class="pending-row"><div class="pl"><b>'+esc(i.id)+' · '+esc(i.name)+'</b><span>'+esc(pendingFor(i.state))+' · 当前 '+esc((LOGIC.cur(i.state)||{id:'已完成'}).id)+' · '+esc(i.owner)+'</span></div><button class="primary" data-act="open" data-id="'+esc(i.id)+'">进入处理</button></div>').join(''):'<p class="hint">当前没有等待人处理的任务</p>')+'</div>';
    h+='<div class="card"><h3>全部任务（'+list.length+'）</h3><div class="grid3">'+list.map(i=>{
      const st=i.state,stt=instStatus(st),p=LOGIC.cur(st);
      const last=lastEvent(st);
      return '<div class="ov-card '+stt[2]+'"><div class="row" style="justify-content:space-between"><span class="mono">'+esc(i.id)+'</span><span class="badge '+stt[1]+'">'+stt[0]+'</span></div>'+
        '<div class="ttl">'+esc(i.name)+'</div><div class="desc">'+esc(i.desc)+'</div>'+
        (st.parentTaskId?'<div class="meta" style="padding:5px 8px;background:var(--primary-bg);border-radius:6px;color:var(--primary)"><button class="lnk" data-nav="open-task" data-task="'+esc(st.parentTaskId)+'">派生自 '+esc(st.parentTaskId)+'</button> · 第 '+esc(st.parentRound)+' 轮</div>':'')+
        '<div class="row" style="justify-content:space-between"><span class="badge gray">'+esc(p?p.id+' '+p.name:'已完成')+'</span><span class="mono">'+st.approvals.length+'/11 门禁</span></div>'+
        miniProgress(st)+
        '<div class="meta">工件 '+st.artifacts.length+' · 证据 '+st.evidences.length+' · 打回 '+st.reviewNotes.length+
          ' · 执行凭证 <button class="lnk" data-nav="open-receipt" data-task="'+esc(i.id)+'">'+st.traces.length+' 步随时可查</button></div>'+
        '<div class="last">'+esc(last.slice(0,110))+'</div>'+
        '<div class="foot"><span class="mono">'+esc(i.owner)+'</span><button class="primary" data-act="open" data-id="'+esc(i.id)+'">进入流程</button></div></div>';
    }).join('')+'</div></div>';
    return h;
  }

  /* ============ 单任务流程页 ============ */
  function nextActor(){
    if(PLAY) return {role:'auto',text:'自动执行中 '+PLAY.i+'/'+PLAY.plan.length+' 步，过程与事件日志实时展示'};
    const p=LOGIC.cur(S);
    if(!p) return {role:'human',text:'本轮闭环已完成，由人决定是否开启下一轮'};
    if(p.id==='G4'){
      // 并发模型下不能只看全局游标 currentTask（它可能指向已签字的 Task），
      // 必须按实际待办集合判断：熔断 → 待签字 → 待执行，逐一给出真实提示。
      const frozen=S.tasks.filter(t=>S.escalated[t.id]);
      if(frozen.length) return {role:'human',text:frozen.map(t=>t.id).join('、')+' 已熔断冻结，需要人在「循环 Review」页裁决'};
      const pend=LOGIC.tasksAwaitingReview(S);
      if(pend.length){
        const need=pend.filter(t=>{const o=S.outOfScope[t.id];return o&&o.files.length&&!o.explanation;});
        if(need.length) return {role:'human',text:need.map(t=>t.id).join('、')+' 检出越界改动，需要人在「循环 Review」页填写说明'};
        return {role:'human',text:pend.map(t=>t.id).join('、')+(pend.length>1?' 等 '+pend.length+' 个 Task':'')+' 证据齐备，等待人在「循环 Review」页逐个 Review 签字'};
      }
      const busy=S.tasks.filter(t=>{
        const st=S.taskStep[t.id]||{};
        return !st.test||!st.red||!st.impl||!st.green||!S.evidences.some(e=>e.taskId===t.id&&e.type==='out_of_scope');
      });
      if(busy.length) return {role:'auto',text:busy.map(t=>t.id).join('、')+' 前置动作未完成（正常流转应已自动执行；刷新中断可用「手动触发」恢复）'};
      return {role:'human',text:S.tasks.length+' 个 Task 已全部完成，等待人在「审批台」批准 G4 门禁'};
    }
    const hasArt=S.artifacts.some(a=>a.phase===p.id&&a.kind==='ai');
    const hasEv=S.evidences.some(e=>e.phase===p.id&&e.kind==='stage');
    if(!hasArt||!hasEv) return {role:'auto',text:p.id+' 阶段产出与证据未齐（正常流转应已自动执行；刷新中断可用「手动触发」恢复）'};
    if(p.id==='G10'&&S.memories.some(m=>m.round===S.round&&m.status==='candidate')) return {role:'human',text:'G10 候选记忆等待人在「记忆确认」页确认或否决'};
    if(LOGIC.autoCheck(S).passed) return {role:'human',text:p.id+' 自动校验通过，等待人在「审批台」签署门禁'};
    return {role:'human',text:p.id+' 存在未满足的校验项，等待人处理'};
  }
  function stepBanner(){
    const n=nextActor(),inst=activeInst();
    const crumb='<span class="badge gray">'+esc(inst.id)+' · '+esc(inst.name)+'</span>';
    // 血缘：派生任务标明来自哪个任务，并能一键回到源任务查它已闭环留档的工件与凭证
    // 用 data-nav（查看导航）而非 data-act —— 三个角色视图的追溯页都要求零流程动作按钮
    const lineage=(S.parentTaskId
      ? '<button class="lnk" data-nav="open-task" data-task="'+esc(S.parentTaskId)+'">派生自 '+esc(S.parentTaskId)+'（第 '+esc(S.parentRound)+' 轮）</button>'
      : '')+
      ((inst.derivedTasks&&inst.derivedTasks.length)
        ? '<span class="badge gray">已派生 '+inst.derivedTasks.map(esc).join('、')+'</span>' : '');
    if(n.role==='auto') return '<div class="nextstep">'+crumb+lineage+'<span class="who">待自动执行</span><span>'+linkify(n.text)+'</span><span class="badge gray">系统自动完成</span></div>';
    return '<div class="nextstep">'+crumb+lineage+'<span class="who">待你处理</span><span>'+linkify(n.text)+'</span><span class="badge green">人的动作</span></div>';
  }
  function renderSide(){
    const w=WS[VIEW];
    document.getElementById('ws-title').textContent=w.title;
    document.getElementById('duty').innerHTML=w.duty;
    document.getElementById('nav').innerHTML=w.tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+t[1]+'</button>').join('');
    document.getElementById('side-phases').innerHTML=LOGIC.PHASES.map((p,i)=>'<div class="'+(i<S.phaseIdx?'done':i===S.phaseIdx?'now':'')+'"><span class="dot"></span>'+p.id+' '+esc(p.name)+'</div>').join('');
    document.querySelectorAll('#rolestrip button').forEach(b=>b.classList.toggle('on',b.dataset.view===VIEW));
  }
  function runStatus(){return PLAY?'<span class="badge amber">执行中 '+PLAY.i+'/'+PLAY.plan.length+'</span>':'<span class="badge gray">空闲 · 上次授权已执行完毕</span>';}
  function todoList(items,done){
    return '<ul class="todo">'+items.map(x=>'<li><span class="mk '+(done?'ck':'dot2')+'">'+(done?'✓':'·')+'</span><span class="txt">'+linkify(x)+'</span></li>').join('')+'</ul>';
  }
  function checkList(items){
    return '<ul class="todo">'+items.map(i=>'<li><span class="mk '+(i.ok?'ck':'warn2')+'">'+(i.ok?'✓':'!')+'</span><span class="txt">'+linkify(i.label)+
      (!i.ok&&i.why?'<em>'+linkify(i.why)+'</em>':'')+'</span></li>').join('')+'</ul>';
  }
  function runSteps(items,emptyText){
    if(!items.length)return '<p class="hint">'+esc(emptyText||'该阶段没有待自动执行的动作')+'</p>';
    return '<ul class="runlist">'+items.map((x,i)=>'<li><i>'+String(i+1).padStart(2,'0')+'</i><b class="'+esc(x.actor)+'">'+esc(x.actor)+'</b><span>'+esc(x.step)+' · '+esc(x.detail)+'</span></li>').join('')+'</ul>';
  }
  /* 执行授权单：批准前让人知道本阶段做了什么、按什么标准判，以及批准后放出去的是哪一批活 */
  function authCard(){
    const p=LOGIC.cur(S),c=LOGIC.autoCheck(S),nx=LOGIC.PHASES[S.phaseIdx+1]||null;
    const steps=nx?LOGIC.previewNextRun(S):[];
    let h='<div class="card"><h3>执行授权单 · 批准前请确认'+ro()+'</h3>'+
      '<p class="sub">依据《AI开发流程设计》2.3 各阶段「AI 职责 / 产出物 / 门禁」。<b>批准放行 = 确认本阶段达标 + 授权下一阶段自动执行</b>，不再需要单独点触发。</p><div class="grid2">';
    h+='<div class="authbox"><div class="row" style="justify-content:space-between"><b>'+p.id+' '+esc(p.name)+' · 本阶段</b>'+
      '<span class="badge '+(c.passed?'green':'amber')+'">'+(c.passed?'校验通过':'未达标')+'</span></div>'+
      '<div class="authsec">AI 与工具链做了什么（已执行）</div>'+todoList(p.todo,true)+
      '<div class="authsec">本阶段通过标准 · 系统自动校验结果</div>'+checkList(c.items)+'</div>';
    if(nx){
      h+='<div class="authbox next"><div class="row" style="justify-content:space-between"><b>批准后自动启动 · '+nx.id+' '+esc(nx.name)+'</b><span class="badge amber">待授权</span></div>'+
        '<div class="authsec">将要做的事</div>'+todoList(nx.todo,false)+
        '<div class="authsec">什么标准才能通过（下一道门禁判据）</div>'+todoList(nx.criteria,false)+
        '<div class="authsec">系统实际会执行的 '+steps.length+' 步 · 主体分工</div>'+runSteps(steps,'进入该阶段后按 Task 逐项生成执行步骤')+'</div>';
    }else{
      h+='<div class="authbox next"><b>本轮最后一道门禁</b><div class="authsec">批准后 G0–G10 闭环完成，不再启动新阶段；可在「记忆确认」页开启下一轮验证经验回流。</div>'+todoList(p.criteria,false)+'</div>';
    }
    // G4 阶段：批准前要能看清「哪些 Task 已签字、哪些还待签、依赖关系如何」
    if(p.id==='G4'&&S.tasks.length){
      const batch=LOGIC.batchIds(S),pend=LOGIC.tasksAwaitingReview(S);
      const signed=S.tasks.filter(t=>S.taskStep[t.id]&&S.taskStep[t.id].review==='ok').map(t=>t.id);
      const frozen=S.tasks.filter(t=>S.escalated[t.id]).map(t=>t.id);
      h+='<div class="authbox next" style="grid-column:1/-1"><b>G4 逐 Task 签字情况</b>'+
        '<div class="authsec">已签字：'+(signed.length?esc(signed.join('、')):'（无）')+
        ' ｜ 待独立评审：'+(pend.length?esc(pend.map(t=>t.id).join('、')):'（无）')+
        (frozen.length?' ｜ 熔断待裁决：'+esc(frozen.join('、')):'')+'</div>'+
        '<div class="authsec">依赖关系（前置 Task 签字后才开工）</div>'+
        S.tasks.map(t=>('· '+esc(t.id)+' '+(t.deps&&t.deps.length?('依赖 '+esc(t.deps.join('、'))):'无依赖'))).join('<br>')+
        '</div>'+
        (batch.length>1?'<div class="authsec">下一批可并行开工：'+esc(batch.join('、'))+'（依赖已满足且改动文件互不重叠）</div>':'')+
        '</div>';
    }
    h+='<div class="chipbar" style="margin-top:12px"><button class="chip" data-nav="receipt-all" data-actor="all">查看本任务全部执行凭证</button>'+
      '<span class="hint">上面列出的每一步执行后都会生成完整凭证（主体 / 时间 / 输入 / 加载方式 / 输出 / 关联），随时可在「执行追溯」页反查。</span></div>';
    return h+'</div></div>';
  }
  /* G4 签字授权单：批次语义 —— 展示本批各 Task 要做的事、下一批会跑什么、什么标准才能通过 */
  function reviewCard(t){
    const g=LOGIC.PHASES[4],steps=LOGIC.previewNextTaskRun(S);
    const batch=LOGIC.batchIds(S);
    // 人此刻实际面对的是「待评审的 Task 集合」，而不是「下一批可开工的 Task」。
    // 并行时多个 Task 同时待签，验证方式必须逐 Task 列出，
    // 只显示其中一个会被误读成整批共用一条判据。
    const pend=LOGIC.tasksAwaitingReview(S);
    const focus=pend.length?pend.map(x=>x.id):batch;
    const verifySec = focus.length>1
      ? '<div class="authsec">各 Task 的验证方式（各自独立判据）</div>'+
        focus.map(id=>{const b=LOGIC.taskById(S,id);return b?('<div style="margin:3px 0">· <b>'+esc(b.id)+'</b> '+esc(b.title)+' —— '+esc(b.verify)+'</div>'):'';}).join('')
      : '<div class="authsec">本 Task 验证方式：'+esc(t.verify)+'</div>';
    const titleSec = focus.length>1
      ? (pend.length?'本批 '+pend.length+' 个 Task 并行待签：':'本批 '+batch.length+' 个 Task 并行：')+esc(focus.join('、'))
      : t.id+' '+esc(t.title);
    return '<div class="card"><h3>本次签字授权什么'+ro()+'</h3><div class="grid2">'+
      '<div class="authbox"><b>'+esc(titleSec)+'</b>'+
      '<div class="authsec">要做的事</div>'+todoList(g.todo,false)+
      verifySec+
      '<div class="authsec">评审单位：单个 Task —— 各自独立签字，互不阻塞</div></div>'+
      '<div class="authbox next"><b>什么标准才能通过</b>'+todoList(g.criteria,false)+
      '<div class="authsec">签字即授权后续自动执行（'+steps.length+' 步）；打回或裁决同样连带重跑</div>'+
      runSteps(steps,'全部 Task 均已签字，下一步是人在审批台批准 G4 门禁')+'</div>'+
      '</div></div>';
  }
  function triggerButton(label){
    const plan=LOGIC.buildRunPlan(S);
    return '<button class="ghost" data-act="manual-run" '+((PLAY||!plan.length)?'disabled':'')+'>'+esc(label)+'</button>';
  }
  /* 所有人工判断最终都汇到这里：批准 / 打回 / Review / 裁决 / 新建任务各自只点一次，
     后续执行由系统按授权单自动编排，AI 与工具链分工完成。 */
  function startAutoRun(reason,action){
    if(PLAY)return false;
    const plan=LOGIC.buildRunPlan(S);
    if(!plan.length)return false;
    const pid=(LOGIC.cur(S)||{id:'DONE'}).id;
    const nA=plan.filter(x=>x.actor==='ai').length,nT=plan.filter(x=>x.actor==='toolchain').length;
    LOGIC.log(S,'human',action||'AUTO_RUN_AUTHORIZED',pid,
      reason+' · 授权 '+plan.length+' 步自动执行（AI '+nA+' / 工具链 '+nT+' / 系统编排 '+(plan.length-nA-nT)+'）');
    PLAY={plan,i:0};save();render();playTick();
    return true;
